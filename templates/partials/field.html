{% load cp %}
<div {% if field.field.widget.input_type == 'hidden' %}hidden{% endif %}>
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-start gap-3 text-body">
      {{ field }}
      <span>{{ field.label }}{% if field.help_text %}<span class="hint block">{{ field.help_text }}</span>{% endif %}</span>
    </label>
  {% else %}
    <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field|as_input }}
    {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
  {% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
