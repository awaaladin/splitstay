{% load cp %}
<div id="bell-list"{% if oob %} hx-swap-oob="true"{% endif %} class="max-h-[22rem] overflow-y-auto">
  {% for n in bell_notifications %}
    <a href="{% url 'web:notification_open' n.pk %}" class="flex gap-3 border-b border-line px-4 py-3 last:border-0 hover:bg-sunken">
      <span class="mt-1.5 h-2 w-2 flex-none rounded-full {% if n.read_at %}bg-transparent{% else %}bg-primary{% endif %}"></span>
      <span class="min-w-0">
        <span class="block truncate text-body font-medium">{{ n.title }}</span>
        {% if n.body %}<span class="mt-0.5 block text-meta text-muted line-clamp-2">{{ n.body }}</span>{% endif %}
        <span class="mt-1 block text-micro normal-case tracking-normal text-muted">{{ n.created_at|timesince }} ago</span>
      </span>
    </a>
  {% empty %}
    <p class="px-4 py-8 text-center text-meta text-muted">You're all caught up.</p>
  {% endfor %}
</div>
